[workspace]
resolver = "3"
members = [
  "agent/warp-ztna-app/src-tauri",
  "libs/warp-ztna-cfg",
  "libs/warp-ztna-err",
  "libs/warp-ztna-nbrpc",
]


[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.95"


[workspace.dependencies]
orion-error = { version = "0.8.1", default-features = false, features = ["derive"] }
prost = "0.13"
prost-types = "0.13"
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ssh-key = "0.6"
thiserror = "2.0"
tokio = { version = "1.47", features = ["full"] }
tonic = { version = "0.12", features = ["transport"] }
tonic-build = "0.12"
tower = "0.5"
url = "2.5"
warp-ztna-cfg = { path = "libs/warp-ztna-cfg" }
warp-ztna-err = { path = "libs/warp-ztna-err" }
warp-ztna-nbrpc = { path = "libs/warp-ztna-nbrpc" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
