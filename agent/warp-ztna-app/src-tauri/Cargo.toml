[package]
name = "warp-ztna-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "warp_ztna_app_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
base64 = "0.22"
getrandom = "0.2"
ipnet.workspace = true
log = "0.4"
open = "5.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
ssh-key.workspace = true
tauri = { version = "2.8", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-autostart = "2.5"
tauri-plugin-notification = "2.3"
tauri-plugin-clipboard-manager = "2"
time = { version = "0.3", features = ["formatting", "local-offset", "macros", "parsing"] }
tokio.workspace = true
url.workspace = true
warp-ztna-cfg.workspace = true
warp-ztna-err.workspace = true
warp-ztna-nbrpc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSMenu", "NSMenuItem", "NSMenuItemBadge", "NSStatusItem", "NSEvent"] }
objc2-foundation = { version = "0.3", features = ["NSString"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[lints.rust]
unsafe_code = "allow"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
