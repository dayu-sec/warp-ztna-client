<!DOCTYPE html>

<title>Warp ZTNA 引擎服务</title>
</head>
<body>
<h2>Warp ZTNA 引擎服务</h2>
<p>本包安装 Warp ZTNA 引擎服务，不含桌面界面。继续安装前，按本机现状对照：</p>
<ul>
<li><strong>本机已安装引擎服务：</strong>按<strong>升级</strong>处理——停旧服务、换本包引擎、重新注册并启动（服务短暂中断）；状态目录（<code>/var/lib/warp-ztna</code>，本机入网身份所在）与配置目录（<code>/etc/warp-ztna</code>）保留。</li>
<li><strong>尚未安装：</strong>直接安装即可。</li>
</ul>
<p>装完后，把同一镜像里的 Warp ZTNA 应用拖入 Applications 即可使用。</p>
</body>
</html>
